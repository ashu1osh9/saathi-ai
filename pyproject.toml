[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saathi-ai"
version = "0.3.0"
description = "Accessible Hindi/Hinglish voice assistance with real Gnani Prisma and Timbre"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<1",
    "pydantic>=2.10,<3",
]

[project.scripts]
saathi-server = "saathi.serve:main"

[project.urls]
Repository = "https://github.com/ashu1osh9/saathi-ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
saathi = ["static/*.html", "static/*.js", "static/*.css"]
