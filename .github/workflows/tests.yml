name: Saathi checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m pip check
      - run: python -m pip wheel --no-deps --wheel-dir test-results/wheels .
      - run: node --test tests/frontend.test.cjs
      - run: npm run check
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_browser.py -v
        env:
          SAATHI_E2E: '1'
          GNANI_API_KEY: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-browser-screenshots
          path: test-results/
          if-no-files-found: ignore
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag saathi-ai:ci .
      - run: python3 tools/container_smoke.py --image saathi-ai:ci
      # Build and disposable local runtime checks only. No registry push or deployment.
